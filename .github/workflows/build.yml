name: Build OpenCore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opencore-main-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix distribution ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assign a release newer than existing installed builds
        id: version
        run: |
          $version = node --input-type=module -e "import {releaseVersion} from './scripts/release-version.mjs'; console.log(releaseVersion(process.env.GITHUB_RUN_NUMBER));"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENCORE_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Apply the official OpenCore logo to browser-extension surfaces
        run: python distribution/sync-branding.py
      - name: Test manual update controls and release version ordering
        run: |
          npx vitest run src/AppUpdateControls.test.tsx src/App.test.tsx src/ModelLibrary.test.tsx src/media-catalog.test.ts src/image-generation-panel.test.ts src/chat-image-picker.test.tsx src/chat-image-composer.test.tsx src/chat-postprocessing.test.tsx src/image-preview-cache.test.ts src/prompt-assistant.test.tsx src/ModelProfileOptions.test.tsx src/FileChangesReceipt.test.tsx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/test-release-versioning.mjs scripts/test-normalize-public-updater.mjs distribution/test-manual-update-policy.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test distribution/test-update-manifest.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location distribution
          python -m unittest -v test_publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_permanent_bootstrap
          $publishTestsExit = $LASTEXITCODE
          Pop-Location
          if ($publishTestsExit -ne 0) { exit $publishTestsExit }
          node --test tests/chrome-dom.test.mjs tests/chrome-connection.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test isolated runtime setup and download admission
        working-directory: distribution
        run: |
          python -m unittest -v test_setup_repair
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_update_handoff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-install-coordinator.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-model-view-cache.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-mobile-host.cjs test-hub-reconnect.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-native-recipe-data.cjs test-native-studio-data.cjs test-image-conversations.cjs test-echo-profiles.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check Pillow==11.3.0 aiohttp==3.11.8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s ../src-tauri/resources/studio -p "test*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Hugging Face metadata, token protection, downloads and runtime isolation
        env:
          PYTHONPATH: ${{ github.workspace }}/src-tauri/resources/runtime-setup/hf-extension
        run: |
          python -m unittest discover -s distribution/hf-extension/tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s distribution/hf-extension -p "test_hf_runtime.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s src-tauri/resources/runtime-setup/hf-extension -p "test_hf_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the pinned model catalog
        run: |
          python -m unittest discover -s distribution/hf-research -p test_build_catalog.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python distribution/hf-research/build_catalog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python distribution/build-publisher-catalog.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify ECHO context continuity and cache ownership
        run: |
          python -m unittest discover -s src-tauri/resources/echo -p "test_echo*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the verified newer native baseline and current committed frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python distribution/prepare.py --inputs distribution/.output/inputs
      - name: Install the rendered-test browser
        run: npx playwright install chromium
      - name: Verify rendered downloads, connectors, footer and manual updates
        working-directory: distribution
        env:
          OPENCORE_VIEW_QA_REPORT: .output/cached-views-qa.json
        run: |
          node --test test-conversation-deletion.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-model-install.cjs candidate-dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-hub.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-image-chat.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-chat-image-picker.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-menu-scroll.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-hub-pagination.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-hub-ocr.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-runtime-notifications.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-managed.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-builtin-presets.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-computer-models.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node connector-research/qa-connectors.cjs --patched
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-footer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-updates.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-model-removal.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-generation-settings.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-chat-deliverables.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-capture-coverage.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-cached-views.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test-mobile-render.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-first-run.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-branding.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installer update handoff and reopening
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $nsis)) {
            choco install nsis --version 3.11 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python distribution/qa-update-installer.py --nsis $nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the complete app package with the official logo and runtime
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $nsis)) {
            choco install nsis --version 3.11 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python distribution/package.py --app distribution/.output/inputs/app --python distribution/.output/inputs/app/test-python --output distribution/.output/release --version $env:OPENCORE_RELEASE_VERSION --commit $env:GITHUB_SHA --icon src-tauri/icons/icon.ico --logo src-tauri/icons/icon.png --webview distribution/.output/inputs/MicrosoftEdgeWebview2Setup.exe --nsis $nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify an isolated install and the packaged Python and helpers
        run: |
          $installer = (Resolve-Path -LiteralPath 'distribution/.output/release/OpenCore Package.exe').Path
          $testRoot = Join-Path $env:RUNNER_TEMP 'opencore-installer-check'
          if (Test-Path -LiteralPath $testRoot) { throw 'Isolated test folder already exists' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/S','/TEST',('/D=' + $testRoot)) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          python distribution/qa-share-installer.py --root $testRoot --manifest distribution/.output/release/package-manifest.json --output distribution/.output/release/installer-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$testRoot/test-python/python.exe" -I -B distribution/qa-portable-runtime.py --root $testRoot --output distribution/.output/release/runtime-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reuse the permanent signed setup unchanged
        run: python distribution/permanent_bootstrap.py --output distribution/.output/release --app-version $env:OPENCORE_RELEASE_VERSION
      - name: Sign the new app package and verify the permanent setup
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri signer sign 'distribution/.output/release/OpenCore Package.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tauri signer sign 'distribution/.output/release/OpenCore Update.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node distribution/verify-signature.cjs 'distribution/.output/release/OpenCore Update.exe' 'distribution/.output/release/OpenCore Update.exe.sig' src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node distribution/verify-signature.cjs 'distribution/.output/release/OpenCore Package.exe' 'distribution/.output/release/OpenCore Package.exe.sig' src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node distribution/verify-signature.cjs 'distribution/.output/release/OpenCore Setup.exe' 'distribution/.output/release/OpenCore Setup.exe.sig' src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the small setup accepts only genuine signed packages
        run: python distribution/qa-bootstrap.py --exe 'distribution/.output/release/OpenCore Setup.exe' --package 'distribution/.output/release/OpenCore Package.exe' --signature 'distribution/.output/release/OpenCore Package.exe.sig'
      - name: Verify changed-file updater payload and transaction behavior
        run: |
          python -m unittest discover -s distribution -p test_incremental_update.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          python distribution/qa-incremental-update.py --directory distribution/.output/release --nsis $nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the verified signed installer for independent publication retries
        uses: actions/upload-artifact@v4
        with:
          name: opencore-signed-release-${{ github.run_id }}
          path: distribution/.output/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: Keep verification evidence and failed build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencore-release-checks-${{ github.run_number }}
          path: |
            distribution/.output/update-controls.png
            distribution/.output/update-controls-qa.json
            distribution/.output/cached-views-qa.json
            distribution/.output/browser-branding.png
            distribution/.output/browser-branding-qa.json
            distribution/.output/release/*verification.json
            distribution/executable-patch.json
            distribution/candidate-dist-qa.json
            distribution/hub-qa.json
            distribution/statusbar-qa.json
            distribution/connector-research/qa-patched.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: opencore-signed-release-${{ github.run_id }}
          path: distribution/.output/release/
      - name: Publish the completed signed manual update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCORE_RELEASE_VERSION: ${{ needs.windows.outputs.release_version }}
        run: python distribution/publish.py --directory distribution/.output/release --version "$OPENCORE_RELEASE_VERSION" --commit "$GITHUB_SHA"
