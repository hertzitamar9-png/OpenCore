name: Build OpenCore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # Keep private-repository builds on the owner's machine, not paid hosted minutes.
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify installed Rust toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare Claude Agent SDK runtime
        run: node scripts/prepare-claude-harness.mjs
      - name: Test Claude Agent SDK transport and ECHO context policy
        run: node scripts/test-claude-protocol.mjs
      - name: Benchmark exact ECHO archive scaling
        run: python scripts/echo_archive_scale.py
      - name: Test ECHO cross-turn archive continuity
        run: python src-tauri/resources/echo/test_echo_memory_continuity.py
      - name: Test ECHO conversation and archive runtime
        run: python scripts/test_echo_live.py
      - name: Verify bundled DuoCore runtime
        run: node scripts/verify-doucode-runtime.mjs
      - name: Test DuoCore context API
        run: |
          python scripts/test_duocore_server.py
          python scripts/test_duocore_sampling.py
      - name: Verify LFM native runtime and tool boundaries
        run: |
          node scripts/verify-lfm-runtime.mjs
          python scripts/test_lfm_protocol.py
          python scripts/test_lfm_sampling.py
      - name: Test frontend
        run: npm test
      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --lib
      - name: Test release version ordering
        run: node --test scripts/test-release-versioning.mjs
      - name: Version this push
        shell: powershell
        run: |
          node scripts/release-version.mjs $env:GITHUB_RUN_NUMBER
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: OpenCore v__VERSION__
          releaseBody: Windows installer built from this main branch push.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
