      - name: Retain rendered validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencore-rendered-checks-${{ github.run_id }}
          path: |
            distribution/.output/ui-fingerprint.json
            distribution/.output/cached-views-qa.json
            distribution/.output/browser-branding.png
            distribution/.output/browser-branding-qa.json
            distribution/candidate-dist-qa.json
            distribution/hub-qa.json
            distribution/statusbar-qa.json
            distribution/connector-research/qa-patched.json
          if-no-files-found: ignore
          retention-days: 7

  windows:
    needs: agent-engine
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pin the compressor used to fit the recovered executable's fixed
          # asset slots. Node 22's Brotli exceeds the App slot on this build.
          node-version: '25.9.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            distribution/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default includes the obsolete SDK package "tools".
          # Current SDK managers provide it through cmdline-tools instead.
          packages: 'platform-tools'
      - name: Require the existing Android signing key
        env:
          OPENCORE_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPENCORE_ANDROID_KEYSTORE_BASE64 }}
          OPENCORE_ANDROID_STORE_PASSWORD: ${{ secrets.OPENCORE_ANDROID_STORE_PASSWORD }}
        run: python distribution/android_release.py --check-signing
      - name: Install the pinned Android build tools and platform
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install build dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix distribution ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assign a release newer than existing installed builds
        id: version
        run: |
          $version = node --input-type=module -e "import {releaseVersion} from './scripts/release-version.mjs'; console.log(releaseVersion(process.env.GITHUB_RUN_NUMBER));"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENCORE_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Prepare the Windows installer compiler
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $nsis -PathType Leaf)) {
            $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
            $url = 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip'
            curl.exe --fail --location --retry 2 --connect-timeout 10 --max-time 30 --output $archive $url
            if ($LASTEXITCODE -eq 0) {
              $expected = 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1'
              if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
                throw 'The NSIS 3.11 archive failed SHA-256 verification.'
              }
              Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
              $nsis = Join-Path $env:RUNNER_TEMP 'nsis-3.11/makensis.exe'
            } else {
              choco install nsis --version 3.11 --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          if (!(Test-Path -LiteralPath $nsis -PathType Leaf)) { throw 'makensis.exe is missing.' }
          "OPENCORE_MAKENSIS=$nsis" >> $env:GITHUB_ENV
      - name: Apply the official OpenCore logo to browser-extension surfaces
        run: python distribution/sync-branding.py
      - name: Install runtime test dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 aiohttp==3.11.8 pytest==8.3.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the pinned model catalog
        run: |
          python -m unittest discover -s distribution/hf-research -p test_build_catalog.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python distribution/hf-research/build_catalog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python distribution/build-publisher-catalog.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: opencore-source-built-agent
          path: distribution/.output/agent-engine
      - name: Prepare the verified newer native baseline and current committed frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python distribution/prepare.py --inputs distribution/.output/inputs --agent-engine distribution/.output/agent-engine
      - name: Fingerprint the packaged UI
        run: python distribution/ui_fingerprint.py distribution/candidate-dist distribution/.output/release/ui-fingerprint.json
      - name: Verify the packaged OpenCore agent with local inference and real tools
        run: |
          $app = (Resolve-Path 'distribution/.output/inputs/app').Path
          $env:OPENCORE_AGENT_TEST_EXECUTABLE = Join-Path $app 'codex/node_modules/@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe'
          $env:OPENCORE_CODEX_TEST_RESOURCES = Join-Path $app 'codex'
          $env:OPENCORE_CODEX_TEST_NODE = Join-Path $app 'claude/node.exe'
          node scripts/test-codex-agent-runtime.mjs | Tee-Object -FilePath distribution/.output/agent-engine-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify this release's Android update with its original signing key
        env:
          OPENCORE_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPENCORE_ANDROID_KEYSTORE_BASE64 }}
          OPENCORE_ANDROID_STORE_PASSWORD: ${{ secrets.OPENCORE_ANDROID_STORE_PASSWORD }}
          OPENCORE_ANDROID_BUILD_TOOLS: '36.0.0'
        run: python distribution/android_release.py --output distribution/.output/release
      - name: Test installer update handoff and reopening
        run: |
          python distribution/qa-update-installer.py --nsis $env:OPENCORE_MAKENSIS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the complete app package with the official logo and runtime
        run: |
          python distribution/package.py --app distribution/.output/inputs/app --python distribution/.output/inputs/app/test-python --output distribution/.output/release --version $env:OPENCORE_RELEASE_VERSION --commit $env:GITHUB_SHA --icon src-tauri/icons/icon.ico --logo src-tauri/icons/icon.png --webview distribution/.output/inputs/MicrosoftEdgeWebview2Setup.exe --nsis $env:OPENCORE_MAKENSIS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify an isolated install, the uninstall catalog and packaged dependencies
        run: |
          $installer = (Resolve-Path -LiteralPath 'distribution/.output/release/OpenCore Package.exe').Path
          $testRoot = Join-Path $env:RUNNER_TEMP 'opencore-installer-check'
          if (Test-Path -LiteralPath $testRoot) { throw 'Isolated test folder already exists' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/S','/TEST',('/D=' + $testRoot)) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          python distribution/qa-share-installer.py --root $testRoot --manifest distribution/.output/release/package-manifest.json --output distribution/.output/release/installer-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$testRoot/test-python/python.exe" -I -B distribution/qa-portable-runtime.py --root $testRoot --output distribution/.output/release/runtime-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python distribution/qa-native-bridge-startup.py --root $testRoot --output distribution/.output/release/bridge-startup-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reuse the permanent setup executable unchanged
        run: python distribution/permanent_bootstrap.py --output distribution/.output/release --app-version $env:OPENCORE_RELEASE_VERSION
      - name: Sign the new app package and verify the permanent setup
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri signer sign 'distribution/.output/release/OpenCore Package.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tauri signer sign 'distribution/.output/release/OpenCore Update.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tauri signer sign 'distribution/.output/release/OpenCore Setup.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node distribution/verify-signature.cjs 'distribution/.output/release/OpenCore Update.exe' 'distribution/.output/release/OpenCore Update.exe.sig' src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node distribution/verify-signature.cjs 'distribution/.output/release/OpenCore Package.exe' 'distribution/.output/release/OpenCore Package.exe.sig' src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node distribution/verify-signature.cjs 'distribution/.output/release/OpenCore Setup.exe' 'distribution/.output/release/OpenCore Setup.exe.sig' src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the small setup accepts only genuine signed packages
        run: python distribution/qa-bootstrap.py --exe 'distribution/.output/release/OpenCore Setup.exe' --package 'distribution/.output/release/OpenCore Package.exe' --signature 'distribution/.output/release/OpenCore Package.exe.sig' --update 'distribution/.output/release/OpenCore Update.exe' --update-signature 'distribution/.output/release/OpenCore Update.exe.sig'
      - name: Verify changed-file updater payload and transaction behavior
        run: |
          python -m unittest discover -s distribution -p test_incremental_update.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python distribution/qa-incremental-update.py --directory distribution/.output/release --nsis $env:OPENCORE_MAKENSIS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the verified signed installer for independent publication retries
        uses: actions/upload-artifact@v4
        with:
          name: opencore-signed-release-${{ github.run_id }}
          path: distribution/.output/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: Keep verification evidence and failed build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencore-release-checks-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            distribution/.output/agent-engine-verification.json
            distribution/.output/update-controls.png
            distribution/.output/update-controls-qa.json
            distribution/.output/cached-views-qa.json
            distribution/.output/browser-branding.png
            distribution/.output/browser-branding-qa.json
            distribution/.output/release/*verification.json
            distribution/executable-patch.json
            distribution/candidate-dist-qa.json
            distribution/hub-qa.json
            distribution/statusbar-qa.json
            distribution/connector-research/qa-patched.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [windows, validation, rendered]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: opencore-signed-release-${{ github.run_id }}
          path: distribution/.output/release/
      - uses: actions/download-artifact@v4
        with:
          name: opencore-ui-fingerprint-${{ github.run_id }}
          path: distribution/.output/rendered-checks
      - name: Require identical tested and packaged UI assets
        run: python distribution/ui_fingerprint.py --compare distribution/.output/release/ui-fingerprint.json distribution/.output/rendered-checks/ui-fingerprint.json
      - name: Publish the completed signed manual update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCORE_RELEASE_VERSION: ${{ needs.windows.outputs.release_version }}
          OPENCORE_ANDROID_RELEASE_DIR: ${{ github.workspace }}/distribution/.output/release
        run: python distribution/publish.py --directory distribution/.output/release --version "$OPENCORE_RELEASE_VERSION" --commit "$GITHUB_SHA"
