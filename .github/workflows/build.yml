name: Build OpenCore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opencore-main-release
  cancel-in-progress: false

jobs:
  agent-engine:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: engine-cache
        with:
          path: distribution/.output/agent-engine
          key: opencore-agent-windows-x64-${{ hashFiles('distribution/agent_engine.py', 'distribution/agent-engine/**') }}
      - uses: actions/setup-node@v4
        if: steps.engine-cache.outputs.cache-hit != 'true'
        with:
          node-version: '25.9.0'
      - name: Restore exact agent from a prior signed release
        id: signed-agent
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python distribution/restore_agent.py --output distribution/.output/agent-engine
          if ($LASTEXITCODE -eq 0) {
            "restored=true" >> $env:GITHUB_OUTPUT
          } else {
            "restored=false" >> $env:GITHUB_OUTPUT
            Write-Host "Signed recovery unavailable; building from pinned source."
          }
          exit 0
      - name: Build the OpenCore agent from its pinned source
        if: steps.engine-cache.outputs.cache-hit != 'true' && steps.signed-agent.outputs.restored != 'true'
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python distribution/agent_engine.py --output distribution/.output/agent-engine --cache "$env:RUNNER_TEMP/opencore-agent-build" --jobs 4
      - uses: actions/cache/save@v4
        if: steps.engine-cache.outputs.cache-hit != 'true'
        with:
          path: distribution/.output/agent-engine
          key: opencore-agent-windows-x64-${{ hashFiles('distribution/agent_engine.py', 'distribution/agent-engine/**') }}
      - uses: actions/upload-artifact@v4
        with:
          name: opencore-source-built-agent
          path: distribution/.output/agent-engine
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  validation:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            distribution/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix distribution ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assign validation the same release version
        run: |
          $version = node --input-type=module -e "import {releaseVersion} from './scripts/release-version.mjs'; console.log(releaseVersion(process.env.GITHUB_RUN_NUMBER));"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENCORE_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Apply the official OpenCore logo to browser-extension surfaces
        run: python distribution/sync-branding.py
      - name: Test all frontend flows and release version ordering
        run: |
          npx vitest run --maxWorkers=2 --minWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/test-release-versioning.mjs scripts/test-normalize-public-updater.mjs distribution/test-manual-update-policy.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test distribution/test-update-manifest.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location distribution
          python -m unittest -v test_publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_minico_m1_1105
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_permanent_bootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_bootstrap_bridge_policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_bootstrap_installation
          $publishTestsExit = $LASTEXITCODE
          Pop-Location
          if ($publishTestsExit -ne 0) { exit $publishTestsExit }
          node --test tests/chrome-dom.test.mjs tests/chrome-connection.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test isolated runtime setup and download admission
        working-directory: distribution
        run: |
          python -m unittest -v test_setup_repair
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s ../src-tauri/resources/runtime-setup -p "test_runtime_storage.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_phonon_runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_bridge_policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_qa_native_bridge_startup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-native-bridge-policy.cjs test-native-startup-data.cjs ../src-tauri/resources/claude/agent-loop-guard.test.mjs ../src-tauri/resources/claude/runner-loop.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest -v test_update_handoff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-install-coordinator.cjs test-phonon-speech.cjs test-download-ui.cjs test-managed-tts.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-model-view-cache.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-mobile-host.cjs test-hub-reconnect.cjs test-model-runtime-transitions.cjs test-conversation-indicators.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-connector-consent.cjs test-model-admission.cjs test-model-modes.cjs test-group-worker.cjs ../src-tauri/resources/agent/group-tools.test.mjs ../src-tauri/resources/agent/group-runners.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-frontend-catalog.cjs test-group-model-preparation.cjs test-autoloop-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test ../tests/task-progress.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-native-recipe-data.cjs test-native-studio-data.cjs test-image-conversations.cjs test-echo-profiles.cjs context-activity.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check Pillow==11.3.0 aiohttp==3.11.8 jsonschema==4.26.0 pytest==8.3.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s ../src-tauri/resources/studio -p "test*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Hugging Face metadata, token protection, downloads and runtime isolation
        env:
          PYTHONPATH: ${{ github.workspace }}/src-tauri/resources/runtime-setup/hf-extension
        run: |
          python -m unittest discover -s distribution/hf-extension/tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s distribution/hf-extension -p "test_hf_runtime.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Collect test files without importing optional GPU packages during discovery.
          python -m pytest -v -o "python_files=test_hf_*.py test_download_queue*.py" src-tauri/resources/runtime-setup/hf-extension
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s src-tauri/resources/runtime-setup/music-runtime -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test training-free AutoLoop ownership and independent quality gates
        run: |
          python -m pytest distribution/autoloop_tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vitest run src/LearningStudio.test.tsx src/LearningAssistant.test.tsx src/learning-config.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify ECHO context continuity and cache ownership
        run: |
          python -m unittest discover -s src-tauri/resources/echo -p "test_echo*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  rendered:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.9.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            distribution/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install the pinned Android test SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install build and runtime test dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix distribution ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check Pillow==11.3.0 aiohttp==3.11.8 pytest==8.3.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assign the same release version
        run: |
          $version = node --input-type=module -e "import {releaseVersion} from './scripts/release-version.mjs'; console.log(releaseVersion(process.env.GITHUB_RUN_NUMBER));"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENCORE_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Generate the same release UI
        run: |
          python distribution/sync-branding.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python distribution/hf-research/build_catalog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node distribution/build-ui-repair.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python distribution/ui_fingerprint.py distribution/candidate-dist distribution/.output/ui-fingerprint.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the rendered-test browser
        run: npx playwright install chromium
      - name: Verify the independent Android phone runtime and explicit PC routing
        env:
          OPENCORE_UI_OUTPUT: ${{ github.workspace }}/distribution
        run: |
          python -m unittest discover -s android-remote/tests -p test_*.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test android-remote/tests/mobile-shim.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node android-remote/tests/phone-ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify rendered downloads, connectors, footer and manual updates
        working-directory: distribution
        env:
          OPENCORE_VIEW_QA_REPORT: .output/cached-views-qa.json
        run: |
          node --test test-conversation-deletion.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
