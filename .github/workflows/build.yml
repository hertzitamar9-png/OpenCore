name: Build OpenCore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opencore-main-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix distribution ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assign a release newer than existing installed builds
        run: |
          $version = node --input-type=module -e "import {releaseVersion} from './scripts/release-version.mjs'; console.log(releaseVersion(process.env.GITHUB_RUN_NUMBER));"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENCORE_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Apply the official OpenCore logo to browser-extension surfaces
        run: python distribution/sync-branding.py
      - name: Test manual update controls and release version ordering
        run: |
          npx vitest run src/AppUpdateControls.test.tsx src/App.test.tsx src/ModelLibrary.test.tsx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/test-release-versioning.mjs scripts/test-normalize-public-updater.mjs distribution/test-manual-update-policy.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/chrome-dom.test.mjs tests/chrome-connection.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test isolated runtime setup and download admission
        working-directory: distribution
        run: |
          python -m unittest -v test_setup_repair
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test-install-coordinator.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Hugging Face metadata, token protection, downloads and runtime isolation
        env:
          PYTHONPATH: ${{ github.workspace }}/src-tauri/resources/runtime-setup/hf-extension
        run: |
          python -m unittest discover -s distribution/hf-extension/tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s distribution/hf-extension -p "test_hf_runtime.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the pinned model catalog
        run: |
          python -m unittest discover -s distribution/hf-research -p test_build_catalog.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python distribution/hf-research/build_catalog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare the verified newer native baseline and current committed frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python distribution/prepare.py --inputs distribution/.output/inputs
      - name: Install the rendered-test browser
        run: npx playwright install chromium
      - name: Verify rendered downloads, connectors, footer and manual updates
        working-directory: distribution
        run: |
          node qa-model-install.cjs candidate-dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-hub.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node connector-research/qa-connectors.cjs --patched
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-footer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-updates.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-branding.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build OpenCore Setup with the official app logo and complete runtime
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $nsis)) {
            choco install nsis --version 3.11 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python distribution/package.py --app distribution/.output/inputs/app --python distribution/.output/inputs/app/test-python --output distribution/.output/release --version $env:OPENCORE_RELEASE_VERSION --commit $env:GITHUB_SHA --icon src-tauri/icons/icon.ico --logo src-tauri/icons/icon.png --webview distribution/.output/inputs/MicrosoftEdgeWebview2Setup.exe --nsis $nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify an isolated install and the packaged Python and helpers
        run: |
          $installer = (Resolve-Path -LiteralPath 'distribution/.output/release/OpenCore Setup.exe').Path
          $testRoot = Join-Path $env:RUNNER_TEMP 'opencore-installer-check'
          if (Test-Path -LiteralPath $testRoot) { throw 'Isolated test folder already exists' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/S','/TEST',('/D=' + $testRoot)) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          python distribution/qa-share-installer.py --root $testRoot --manifest distribution/.output/release/package-manifest.json --output distribution/.output/release/installer-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$testRoot/test-python/python.exe" -I -B distribution/qa-portable-runtime.py --root $testRoot --output distribution/.output/release/runtime-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign the verified installer for existing OpenCore installations
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri signer sign 'distribution/.output/release/OpenCore Setup.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node distribution/verify-signature.cjs 'distribution/.output/release/OpenCore Setup.exe' 'distribution/.output/release/OpenCore Setup.exe.sig' src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish the completed signed manual update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python distribution/publish.py --directory distribution/.output/release --version $env:OPENCORE_RELEASE_VERSION --commit $env:GITHUB_SHA
      - name: Keep verification evidence and failed build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencore-release-checks-${{ github.run_number }}
          path: |
            distribution/.output/update-controls.png
            distribution/.output/update-controls-qa.json
            distribution/.output/browser-branding.png
            distribution/.output/browser-branding-qa.json
            distribution/.output/release/*verification.json
            distribution/executable-patch.json
            distribution/candidate-dist-qa.json
            distribution/hub-qa.json
            distribution/statusbar-qa.json
            distribution/connector-research/qa-patched.json
          if-no-files-found: ignore
          retention-days: 7
