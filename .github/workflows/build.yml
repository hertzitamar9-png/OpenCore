          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-download-queue.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-hub.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-image-chat.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-chat-image-picker.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-project-hit-targets.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-slash-menu.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-voice-call.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-phonon-microphone.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa-phonon-settings.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-workbench.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-catalog-admission.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-model-modes.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-task-progress.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-groups.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-navigation-rail.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-chat-core-shell.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-group-workspace.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-model-picker-cache.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-menu-scroll.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-hub-pagination.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-hub-ocr.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa-runtime-notifications.cjs
