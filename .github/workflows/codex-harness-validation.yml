name: Codex harness validation

on:
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-harness-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test GGUF quantization catalog refresh
        run: python -m unittest scripts.test_sync_gguf_variants -v
      - name: Refresh published GGUF quantizations before native validation
        run: python scripts/sync_gguf_variants.py
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-native-workspace-v1-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/native/desktop_focus_guard.c', 'scripts/build-desktop-focus-guard.ps1') }}
          restore-keys: windows-native-workspace-v1-
      - name: Build and verify desktop focus guard DLL before Cargo
        id: desktop-guard
        shell: pwsh
        run: ./scripts/build-desktop-focus-guard.ps1
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare packaged Node runtime for integration fixtures
        run: node scripts/prepare-claude-connector.mjs
      - name: Prepare pinned OpenAI Codex app-server runtime
        run: node scripts/prepare-codex-harness.mjs
      - name: Probe packaged app-server schema
        run: node scripts/test-codex-app-server-schema.mjs
      - name: Test app-server inference, tools, cancellation, and resume
        run: node scripts/test-codex-agent-runtime.mjs
      - name: Test frontend and integration suites
        run: npm test
      - name: Verify capture borders and historical appearance against rendered production styles
        run: |
          npx playwright install chromium
          node --test tests/desktop-highlight-layout.test.mjs tests/historical-appearance.test.mjs
      - name: Install prebuilt CPU runtime for Phonon precision qualification
        run: |
          python -m pip install --only-binary=:all: torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=:all: transformers==5.18.0
      - name: Qualify Phonon precision and exact checkpoint expansion
        env:
          CUDA_VISIBLE_DEVICES: ''
          HF_HUB_OFFLINE: '1'
        run: python -m unittest discover -s src-tauri/resources/speech -p "test_phonon_*.py" -v
      - name: Test Rust libraries with MSVC
        id: rust-tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          $runner = @('pwsh', '-NoLogo', '-NoProfile', '-File', (Resolve-Path ../scripts/prepare-windows-rust-test-manifest.ps1).Path) | ConvertTo-Json -Compress
          $runnerConfig = Join-Path $env:RUNNER_TEMP 'opencore-native-test-runner.toml'
          [IO.File]::WriteAllText($runnerConfig, "[target.x86_64-pc-windows-msvc]`nrunner = $runner`n", [Text.UTF8Encoding]::new($false))
          cargo --config $runnerConfig test --lib 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'opencore-native-tests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native assertion diagnostics before cache operations
        if: ${{ failure() && steps.rust-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-assertion-diagnostics
          path: ${{ runner.temp }}/opencore-native-tests.log
          retention-days: 7
      - name: Diagnose a failed Windows test executable
        if: ${{ failure() && steps.rust-tests.outcome == 'failure' }}
        shell: powershell
        run: ./scripts/windows-loader-diagnostics.ps1
      - name: Preserve resolved native dependency lock
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-cargo-lock
          path: src-tauri/Cargo.lock
          retention-days: 7
      - name: Preserve Windows loader diagnostics
        if: ${{ failure() && steps.rust-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-loader-diagnostics
          path: artifacts/windows-loader/
          retention-days: 7
      - name: Build Windows app executable without packaging or publishing
        run: npx tauri build --no-bundle
      - name: Save compiled native dependencies for diagnostic retries
        if: ${{ always() && steps.desktop-guard.outcome == 'success' && steps.rust-tests.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-native-workspace-v1-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/native/desktop_focus_guard.c', 'scripts/build-desktop-focus-guard.ps1') }}
