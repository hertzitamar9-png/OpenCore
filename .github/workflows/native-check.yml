name: Check Windows native changes

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-native-workspace-v1-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: windows-native-workspace-v1-
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare bundled connector runtimes
        run: |
          node scripts/prepare-claude-connector.mjs
          node scripts/prepare-codex-harness.mjs
      - name: Test studio cancellation and worker bounds
        run: python -m unittest discover -s src-tauri/resources/studio -p "test*.py"
      - name: Test Windows native library and disposable desktop fixtures
        working-directory: src-tauri
        shell: pwsh
        run: |
          $runner = @('pwsh', '-NoLogo', '-NoProfile', '-File', (Resolve-Path ../scripts/prepare-windows-rust-test-manifest.ps1).Path) | ConvertTo-Json -Compress
          $runnerConfig = Join-Path $env:RUNNER_TEMP 'opencore-native-test-runner.toml'
          [IO.File]::WriteAllText($runnerConfig, "[target.x86_64-pc-windows-msvc]`nrunner = $runner`n", [Text.UTF8Encoding]::new($false))
          cargo --config $runnerConfig test --lib
      - name: Save compiled native dependencies
        if: ${{ always() && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-native-workspace-v1-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
