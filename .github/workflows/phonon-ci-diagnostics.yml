name: Phonon Windows diagnostics

on:
  push:
    branches: ['codex/phonon-ci-diagnostics']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the same pinned CPU qualification runtime
        run: |
          python -m pip install --only-binary=:all: torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=:all: transformers==5.18.0
      - name: Record processor and native Python runtime diagnostics
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors
          python -c "import torch; print(torch.__version__); print(torch.__config__.show()); print(torch.backends.cpu.get_cpu_capability())"
          python -m pip freeze
      - name: Run unchanged qualification with fatal-error diagnostics
        shell: pwsh
        env:
          CUDA_VISIBLE_DEVICES: ''
          HF_HUB_OFFLINE: '1'
          PYTHONFAULTHANDLER: '1'
          TORCH_SHOW_CPP_STACKTRACES: '1'
          ONEDNN_VERBOSE: '1'
        run: |
          python -u -X faulthandler -m unittest discover -s src-tauri/resources/speech -p "test_phonon_*.py" -v
          $qualificationExitCode = $LASTEXITCODE
          Write-Host "Native Python exit code: $qualificationExitCode"
          exit $qualificationExitCode
