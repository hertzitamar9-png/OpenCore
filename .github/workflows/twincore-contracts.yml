name: TwinCore portable contracts

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/resources/fusion/**'
      - 'scripts/fusion/**'
      - 'scripts/publish-model-packages.py'
      - 'tests/fusion/**'
      - '.gitattributes'
      - '.github/workflows/twincore-contracts.yml'
  pull_request:
    paths:
      - 'src-tauri/resources/fusion/**'
      - 'scripts/fusion/**'
      - 'scripts/publish-model-packages.py'
      - 'tests/fusion/**'
      - '.gitattributes'
      - '.github/workflows/twincore-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: '-1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src-tauri/resources/fusion/requirements-native.txt
      - name: Install pinned CPU adapter dependencies
        run: python -m pip install -r src-tauri/resources/fusion/requirements-native.txt pytest==8.3.5
      - name: Test portable bridge, training, streaming and tool contracts
        # Native DLL math and complete checkpoints require separately measured
        # Windows/GPU evidence. The optional Transformers reference is separate.
        run: >-
          python -m pytest tests/fusion
          --ignore=tests/fusion/test_native.py
          --ignore=tests/fusion/test_real_architectures.py
          -q --tb=short --junitxml=twincore-contracts.xml
      - name: Preserve contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twincore-portable-contracts
          path: twincore-contracts.xml
          if-no-files-found: ignore
