<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Workspace capture geometry</title>
  <link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/WorkspacePanel.css">
</head><body><div id="root"><div class="app-window-frame"><header class="window-titlebar">OpenCore layout fixture</header>
  <div class="opencore-shell"><nav class="conversation-app-rail"></nav><div class="opencore-section workspace-visible">
    <header class="section-header">Conversations</header><div class="section-workspace-stage"><main class="section-main"></main>
      <aside class="unified-workspace" style="--workspace-width:480px"><header class="unified-workspace-header"><strong>Workspace</strong></header>
        <div class="unified-workspace-tabs"><button>Files</button><button>Browser</button><button aria-selected="true">Computer</button><button>Side chat</button></div>
        <div class="unified-workspace-content" tabindex="0"><section class="desktop-panel desktop-panel-embedded" aria-label="Windows desktop">
          <div class="desktop-toolbar"><button>Refresh capture</button><button>Fit</button><button>Actual size</button></div>
          <div class="desktop-control-status">Background only</div><div class="desktop-stage desktop-stage-fit"><div class="desktop-screen"><img alt="Intrinsic 1920 by 1080 capture" src="/e2e/fixtures/large-capture.svg"></div></div>
          <div class="desktop-inputbar"><input aria-label="Type in selected window"><button>Apply text</button></div>
        </section></div>
      </aside></div></div><footer class="statusbar">Runtime status</footer>
  </div></div></div></body></html>
