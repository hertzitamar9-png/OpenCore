<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Click test - ready</title>
<style>
  body { font: 16px "Segoe UI", Arial, sans-serif; margin: 0; background: #f4f6f8; color: #1d2733; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: #243447; color: #fff; }
  header h1 { font-size: 18px; margin: 0 0 0 auto; }
  .icon { width: 36px; height: 36px; border: 0; border-radius: 8px; background: #3b5068; color: #fff; font-size: 18px; }
  main { display: grid; grid-template-columns: 220px 1fr; gap: 18px; padding: 18px; }
  nav a { display: block; padding: 8px 10px; color: #1d4f91; text-decoration: none; border-radius: 6px; }
  nav a:hover { background: #e3ebf5; }
  .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px #0002; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  button.text { padding: 8px 16px; border-radius: 6px; border: 1px solid #b8c4d2; background: #fff; font: inherit; }
  button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  label { display: flex; gap: 6px; align-items: center; }
  input[type=text] { padding: 7px 10px; width: 260px; font: inherit; }
</style>
</head>
<body>
<header>
  <h1>מרכז השירות</h1>
  <button class="icon" aria-label="Search">&#128269;</button>
  <button class="icon" aria-label="Notifications">&#128276;</button>
  <button class="icon" aria-label="Settings">&#9881;</button>
</header>
<main>
  <nav>
    <a href="#" data-target="home">דף הבית</a>
    <a href="#" data-target="orders">ההזמנות שלי</a>
    <a href="#" data-target="invoices">חשבוניות</a>
    <a href="#" data-target="support">תמיכה טכנית</a>
    <a href="#" data-target="account">Account details</a>
  </nav>
  <section class="card">
    <div class="row">
      <input type="text" placeholder="חיפוש הזמנה">
      <button class="text">חפש</button>
    </div>
    <div class="row">
      <button class="text">ביטול</button>
      <button class="text primary">שמירה</button>
      <button class="text">Export CSV</button>
      <button class="text">הדפסה</button>
    </div>
    <div class="row">
      <label><input type="checkbox"> קבלת עדכונים במייל</label>
      <label><input type="checkbox"> Remember this device</label>
    </div>
    <div class="row">
      <button class="text">הוספת כתובת</button>
      <button class="text">Delete draft</button>
      <button class="text">צור קשר</button>
    </div>
  </section>
</main>
<script>
  // Every click names what it hit in the window title, so a test can read it from outside.
  const nameOf = (el) => el.getAttribute('aria-label') || el.placeholder || el.innerText.trim() || el.parentElement.innerText.trim();
  document.addEventListener('click', (event) => {
    event.preventDefault();
    const target = event.target.closest('button, a, input, label');
    document.title = 'Click test - ' + (target ? nameOf(target) : 'nothing');
  });
</script>
</body>
</html>
