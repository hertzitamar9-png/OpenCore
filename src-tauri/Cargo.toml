[package]
name = "opencore-control-center"
version = "0.1.30"
description = "OpenCore runtime control and observability"
authors = ["OpenCore"]
edition = "2021"

[lib]
name = "opencore_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-stream = "0.3"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.10"
tauri-plugin-single-instance = "2"
thiserror = "2"
toml_edit = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Graphics_Imaging", "Win32_Graphics_Dwm", "Media_Ocr", "Storage", "Storage_Streams", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
uiautomation = { version = "0.25", features = ["screenshot"] }
windows-uia = { package = "windows", version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Accessibility"] }
windows-capture = "2.0.1"
png = "0.17"
